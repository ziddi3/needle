<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#050506" />
  <title>Needle · Methodz Tuner</title>
  <style>
    :root { --bg:#050506; --fg:#e8eef8; --muted:#6b7a90; --ok:#ff6a2b; --blue:#3db4ff; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; min-height:100dvh; background:radial-gradient(ellipse at 50% 28%,#0c1528 0%,var(--bg) 65%); color:var(--fg); font-family:system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; padding:.75rem 1rem 1.5rem; }
    header { width:min(100%,420px); display:flex; justify-content:space-between; align-items:center; margin-bottom:.35rem; }
    .brand { font-size:.7rem; letter-spacing:.32em; text-transform:uppercase; color:var(--muted); }
    .brand strong { color:var(--fg); font-weight:600; letter-spacing:.18em; }
    .status-pill { font-size:.65rem; letter-spacing:.08em; padding:.28rem .7rem; border-radius:999px; border:1px solid #1e2a3d; color:var(--muted); background:rgba(10,16,28,.7); }
    .status-pill.ok { border-color:rgba(255,106,43,.55); color:var(--ok); box-shadow:0 0 18px rgba(255,106,43,.25); }
    .stage { display:grid; grid-template-columns:auto minmax(0,260px) auto; gap:.4rem .7rem; align-items:center; width:min(100%,480px); margin:.35rem 0 .75rem; }
    .pegs { display:flex; flex-direction:column; gap:1.05rem; }
    .peg { width:42px; height:42px; border-radius:50%; border:2px solid #243044; background:radial-gradient(circle at 32% 28%,#f4f7fc 0%,#9aa8bc 42%,#3d4658 100%); position:relative; opacity:.38; cursor:pointer; transition:border-color .22s,box-shadow .22s,opacity .22s; }
    .peg::after { content:""; position:absolute; inset:9px; border-radius:50%; background:linear-gradient(145deg,#2a3344,#0b1018); }
    .peg .wing { position:absolute; top:50%; left:50%; width:17px; height:5px; margin:-2.5px 0 0 -8.5px; background:linear-gradient(90deg,#e4ebf5,#5e6a7e); border-radius:2px; transform-origin:center; transition:transform .16s cubic-bezier(.22,1,.36,1); z-index:1; }
    .peg.active { opacity:1; border-color:var(--blue); box-shadow:0 0 14px rgba(61,180,255,.4); }
    .peg .label { position:absolute; bottom:-1.1rem; left:50%; transform:translateX(-50%); font-size:.6rem; color:var(--muted); }
    .peg.active .label { color:var(--blue); }
    .left .peg .label { left:auto; right:-.15rem; transform:none; }
    .right .peg .label { left:-.15rem; right:auto; transform:none; }
    .emblem-wrap { position:relative; width:100%; aspect-ratio:1; max-width:260px; margin:0 auto; filter:drop-shadow(0 12px 32px rgba(0,40,120,.45)); }
    .emblem-wrap img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; opacity:0; transition:opacity .28s ease; pointer-events:none; }
    .emblem-wrap img.show { opacity:1; }
    .readout { width:min(100%,420px); text-align:center; }
    .note { font-size:clamp(2.2rem,9vw,3rem); font-weight:300; letter-spacing:.04em; line-height:1; }
    .note.in-tune { color:var(--ok); text-shadow:0 0 28px rgba(255,106,43,.45); }
    .cents { font-size:.95rem; color:var(--muted); margin-top:.2rem; font-variant-numeric:tabular-nums; }
    .hint { font-size:.72rem; color:var(--muted); margin-top:.3rem; min-height:1.1em; }
    .string-row { width:min(100%,420px); display:grid; grid-template-columns:repeat(6,1fr); gap:.4rem; margin-top:.9rem; }
    .string-chip { text-align:center; padding:.55rem .15rem; border-radius:10px; border:1px solid #1e2a3d; background:rgba(10,16,28,.6); font-size:.65rem; color:var(--muted); cursor:pointer; }
    .string-chip.active { border-color:var(--blue); color:var(--blue); background:rgba(61,180,255,.08); }
    .string-chip .n { display:block; font-size:.9rem; font-weight:600; }
    .controls { width:min(100%,420px); display:flex; gap:.6rem; margin-top:1.1rem; justify-content:center; flex-wrap:wrap; }
    button { appearance:none; border:1px solid #243044; background:rgba(14,20,32,.85); color:var(--fg); font-size:.78rem; letter-spacing:.1em; text-transform:uppercase; padding:.7rem 1.15rem; border-radius:999px; cursor:pointer; }
    button.primary { background:linear-gradient(180deg,#1a2a44,#0e1624); border-color:rgba(61,180,255,.45); }
    button.primary.active { border-color:var(--blue); box-shadow:0 0 20px rgba(61,180,255,.3); color:var(--blue); }
    .manual { width:min(100%,420px); margin-top:.9rem; padding:.75rem 1rem; border-radius:12px; border:1px solid #1a2434; background:rgba(8,12,20,.5); display:none; }
    .manual.show { display:block; }
    .manual label { display:flex; justify-content:space-between; font-size:.65rem; color:var(--muted); margin-bottom:.35rem; }
    input[type=range] { width:100%; accent-color:var(--blue); }
    .footer { margin-top:auto; padding-top:1.25rem; font-size:.6rem; letter-spacing:.2em; text-transform:uppercase; color:#3a4658; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><strong>Needle</strong> · Methodz</div>
    <div class="status-pill" id="statusPill">Ready</div>
  </header>
  <div class="stage">
    <div class="pegs left" id="pegsLeft"></div>
    <div class="emblem-wrap" id="emblem">
      <img src="assets/state_flat_sparks.jpg" data-state="flat" alt="" />
      <img src="assets/state_rising.jpg" data-state="rising" alt="" />
      <img src="assets/state_in_tune.jpg" data-state="tune" alt="" />
      <img src="assets/state_in_tune.jpg" data-state="tune-loop" alt="" />
      <img src="assets/state_sharp_rage.jpg" data-state="sharp" alt="" />
    </div>
    <div class="pegs right" id="pegsRight"></div>
  </div>
  <div class="readout">
    <div class="note" id="note">—</div>
    <div class="cents" id="cents">— ¢</div>
    <div class="hint" id="hint">Tap Listen, then pluck a string</div>
  </div>
  <div class="string-row" id="stringRow"></div>
  <div class="controls">
    <button class="primary" id="btnListen">Listen</button>
    <button id="btnManual">Manual</button>
  </div>
  <div class="manual" id="manualPanel">
    <label><span>Cents offset</span><span id="manualVal">0 ¢</span></label>
    <input type="range" id="centsSlider" min="-60" max="60" value="0" step="1" />
  </div>
  <div class="footer">tuning.methodz.ca</div>
  <script>
    const STRINGS = [
      { name: "Low E", note: "E2", freq: 82.41, side: "left" },
      { name: "A", note: "A2", freq: 110.00, side: "left" },
      { name: "D", note: "D3", freq: 146.83, side: "left" },
      { name: "G", note: "G3", freq: 196.00, side: "right" },
      { name: "B", note: "B3", freq: 246.94, side: "right" },
      { name: "High E", note: "E4", freq: 329.63, side: "right" },
    ];
    let activeString = 0, listening = false, currentCents = 0, smoothedCents = 0;
    const pegsLeft = document.getElementById("pegsLeft");
    const pegsRight = document.getElementById("pegsRight");
    const stringRow = document.getElementById("stringRow");
    const layers = [...document.querySelectorAll("#emblem [data-state]")];
    const pegEls = [];
    STRINGS.forEach((s, i) => {
      const peg = document.createElement("div");
      peg.className = "peg";
      peg.innerHTML = `<div class="wing"></div><div class="label">${s.note.replace(/\d/, "")}</div>`;
      peg.onclick = () => selectString(i);
      (s.side === "left" ? pegsLeft : pegsRight).appendChild(peg);
      pegEls.push({ el: peg, stringIndex: i });
      const chip = document.createElement("div");
      chip.className = "string-chip";
      chip.innerHTML = `<span class="n">${s.note.replace(/\d/, "")}</span>${s.name}`;
      chip.onclick = () => selectString(i);
      stringRow.appendChild(chip);
    });
    function selectString(i) {
      activeString = i;
      document.querySelectorAll(".string-chip").forEach((c, idx) => c.classList.toggle("active", idx === i));
      pegEls.forEach(({ el, stringIndex }) => el.classList.toggle("active", stringIndex === i));
      updateUI();
    }
    selectString(0);
    const noteEl = document.getElementById("note");
    const centsEl = document.getElementById("cents");
    const hintEl = document.getElementById("hint");
    const statusPill = document.getElementById("statusPill");
    const btnListen = document.getElementById("btnListen");
    const btnManual = document.getElementById("btnManual");
    const manualPanel = document.getElementById("manualPanel");
    const centsSlider = document.getElementById("centsSlider");
    const manualVal = document.getElementById("manualVal");
    function flameState(c) {
      if (c <= -40) return "flat";
      if (c < -5) return "rising";
      if (Math.abs(c) <= 5) return "tune-loop";
      return "sharp";
    }
    function statusText(c) {
      if (Math.abs(c) <= 5) return "In tune · hold";
      if (c < 0) return "Too low · tighten";
      return "Too high · loosen";
    }
    function updateUI() {
      const s = STRINGS[activeString];
      const c = smoothedCents;
      noteEl.textContent = s.note.replace(/\d/, "");
      noteEl.classList.toggle("in-tune", Math.abs(c) <= 5);
      centsEl.textContent = `${c > 0 ? "+" : ""}${c.toFixed(0)} ¢`;
      hintEl.textContent = statusText(c);
      statusPill.textContent = Math.abs(c) <= 5 ? "Locked" : (listening ? "Listening" : "Ready");
      statusPill.classList.toggle("ok", Math.abs(c) <= 5);
      const state = flameState(c);
      layers.forEach((layer) => layer.classList.toggle("show", layer.dataset.state === state));
      pegEls.forEach(({ el, stringIndex }) => {
        const active = stringIndex === activeString;
        el.classList.toggle("active", active);
        el.querySelector(".wing").style.transform = `rotate(${active ? Math.max(-50, Math.min(50, c)) * 2.4 : 0}deg)`;
      });
    }
    let audioCtx, analyser, mediaStream, buf;
    function freqToCents(freq, target) { return 1200 * Math.log2(freq / target); }
    function detectPitch(buffer, sampleRate) {
      const SIZE = buffer.length;
      let rms = 0;
      for (let i = 0; i < SIZE; i++) rms += buffer[i] * buffer[i];
      rms = Math.sqrt(rms / SIZE);
      if (rms < 0.01) return -1;
      let r1 = 0, r2 = SIZE - 1, thres = 0.2;
      for (let i = 0; i < SIZE / 2; i++) { if (Math.abs(buffer[i]) < thres) { r1 = i; break; } }
      for (let i = 1; i < SIZE / 2; i++) { if (Math.abs(buffer[SIZE - i]) < thres) { r2 = SIZE - i; break; } }
      const buf2 = buffer.slice(r1, r2);
      const n = buf2.length;
      const c = new Array(n).fill(0);
      for (let i = 0; i < n; i++) for (let j = 0; j < n - i; j++) c[i] += buf2[j] * buf2[j + i];
      let d = 0; while (c[d] > c[d + 1]) d++;
      let maxval = -1, maxpos = -1;
      for (let i = d; i < n; i++) if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
      if (maxpos <= 0) return -1;
      const x1 = c[maxpos - 1] || 0, x2 = c[maxpos], x3 = c[maxpos + 1] || 0;
      const a = (x1 + x3 - 2 * x2) / 2, b = (x3 - x1) / 2;
      const T0 = a ? maxpos - b / (2 * a) : maxpos;
      return sampleRate / T0;
    }
    async function startListen() {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const src = audioCtx.createMediaStreamSource(mediaStream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 4096;
        src.connect(analyser);
        buf = new Float32Array(analyser.fftSize);
        listening = true;
        btnListen.classList.add("active");
        btnListen.textContent = "Stop";
        statusPill.textContent = "Listening";
        loop();
      } catch (e) { hintEl.textContent = "Mic permission needed — or use Manual"; console.warn(e); }
    }
    function stopListen() {
      listening = false;
      btnListen.classList.remove("active");
      btnListen.textContent = "Listen";
      if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
      if (audioCtx) audioCtx.close().catch(() => {});
      statusPill.textContent = "Ready";
    }
    function loop() {
      if (!listening) return;
      analyser.getFloatTimeDomainData(buf);
      const freq = detectPitch(buf, audioCtx.sampleRate);
      if (freq > 60 && freq < 1200) {
        let best = activeString, bestDiff = Infinity;
        STRINGS.forEach((s, i) => { const d = Math.abs(freqToCents(freq, s.freq)); if (d < bestDiff) { bestDiff = d; best = i; } });
        if (bestDiff < 100) selectString(best);
        currentCents = Math.max(-80, Math.min(80, freqToCents(freq, STRINGS[activeString].freq)));
      }
      smoothedCents += (currentCents - smoothedCents) * 0.22;
      updateUI();
      requestAnimationFrame(loop);
    }
    btnListen.onclick = () => listening ? stopListen() : startListen();
    btnManual.onclick = () => {
      const on = manualPanel.classList.toggle("show");
      btnManual.classList.toggle("active", on);
      if (on && listening) stopListen();
    };
    centsSlider.oninput = () => {
      currentCents = Number(centsSlider.value);
      smoothedCents = currentCents;
      manualVal.textContent = `${currentCents > 0 ? "+" : ""}${currentCents} ¢`;
      updateUI();
    };
    updateUI();
  </script>
</body>
</html>
