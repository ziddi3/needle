<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#050506" />
  <meta name="description" content="Needle — Methodz flame guitar tuner. Real-time pitch with spinning pegs." />
  <title>Needle · Methodz Tuner</title>
  <style>
    :root {
      --bg: #050506;
      --fg: #e8eef8;
      --muted: #6b7a90;
      --ok: #ff6a2b;
      --blue: #3db4ff;
      --metal: #c5d0e0;
      --red-core: #ff3b1f;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: radial-gradient(ellipse at 50% 28%, #0c1528 0%, var(--bg) 65%);
      color: var(--fg);
      font-family: "SF Pro Text", system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.75rem 1rem 1.5rem;
      overflow-x: hidden;
    }
    header {
      width: min(100%, 420px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .brand {
      font-size: 0.7rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }
    .brand strong { color: var(--fg); font-weight: 600; letter-spacing: 0.18em; }
    .status-pill {
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      padding: 0.28rem 0.7rem;
      border-radius: 999px;
      border: 1px solid #1e2a3d;
      color: var(--muted);
      background: rgba(10, 16, 28, 0.7);
      transition: all 0.25s;
    }
    .status-pill.ok {
      border-color: rgba(255, 106, 43, 0.55);
      color: var(--ok);
      box-shadow: 0 0 18px rgba(255, 106, 43, 0.25);
    }

    .stage {
      display: grid;
      grid-template-columns: auto minmax(0, 240px) auto;
      gap: 0.5rem 0.85rem;
      align-items: center;
      width: min(100%, 460px);
      margin: 0.5rem 0 1rem;
    }

    /* Pegs */
    .pegs { display: flex; flex-direction: column; gap: 1.05rem; }
    .peg {
      width: 42px; height: 42px;
      border-radius: 50%;
      border: 2px solid #243044;
      background: radial-gradient(circle at 32% 28%, #f4f7fc 0%, #9aa8bc 42%, #3d4658 100%);
      position: relative;
      transition: border-color 0.22s, box-shadow 0.22s, opacity 0.22s;
      opacity: 0.38;
      cursor: pointer;
    }
    .peg::after {
      content: "";
      position: absolute; inset: 9px;
      border-radius: 50%;
      background: linear-gradient(145deg, #2a3344, #0b1018);
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.12);
    }
    .peg .wing {
      position: absolute; top: 50%; left: 50%;
      width: 17px; height: 5px;
      margin: -2.5px 0 0 -8.5px;
      background: linear-gradient(90deg, #e4ebf5, #5e6a7e);
      border-radius: 2px;
      transform-origin: center;
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 1;
    }
    .peg.active {
      opacity: 1;
      border-color: var(--blue);
      box-shadow: 0 0 14px rgba(61, 180, 255, 0.4);
    }
    .peg .label {
      position: absolute; bottom: -1.1rem; left: 50%;
      transform: translateX(-50%);
      font-size: 0.6rem; color: var(--muted);
      letter-spacing: 0.05em; white-space: nowrap;
    }
    .peg.active .label { color: var(--blue); }
    .left .peg .label { left: auto; right: -0.15rem; transform: none; }
    .right .peg .label { left: -0.15rem; right: auto; transform: none; }

    /* Emblem + flame */
    .emblem-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      max-width: 240px;
      margin: 0 auto;
    }
    .shield {
      position: absolute; inset: 8%;
      border-radius: 18% 18% 28% 28% / 22% 22% 38% 38%;
      background:
        linear-gradient(160deg, #dce6f4 0%, #8a9bb0 35%, #3a4558 70%, #1a2230 100%);
      box-shadow:
        0 0 0 2px rgba(180, 200, 230, 0.25),
        0 12px 40px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255,255,255,0.35);
      overflow: hidden;
    }
    .shield::before {
      content: "";
      position: absolute; inset: 6%;
      border-radius: inherit;
      border: 1.5px solid rgba(180, 210, 255, 0.35);
      pointer-events: none;
    }
    .m-letter {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      font-family: "Georgia", "Times New Roman", serif;
      font-weight: 700;
      font-size: clamp(4.2rem, 22vw, 5.6rem);
      letter-spacing: -0.04em;
      color: transparent;
      background: linear-gradient(180deg, #f0f6ff 10%, #a8bdd8 55%, #5a6e88 100%);
      -webkit-background-clip: text;
      background-clip: text;
      text-shadow: 0 2px 0 rgba(0,0,0,0.25);
      z-index: 2;
      pointer-events: none;
      mix-blend-mode: soft-light;
      opacity: 0.92;
    }
    .flame-canvas {
      position: absolute;
      left: 50%; top: 52%;
      width: 58%; height: 62%;
      transform: translate(-50%, -50%);
      z-index: 1;
      border-radius: 40% 40% 45% 45%;
      overflow: hidden;
    }
    canvas#flame { width: 100%; height: 100%; display: block; }

    /* Readout */
    .readout {
      width: min(100%, 420px);
      text-align: center;
      margin-top: 0.25rem;
    }
    .note {
      font-size: clamp(2.4rem, 10vw, 3.2rem);
      font-weight: 300;
      letter-spacing: 0.04em;
      line-height: 1;
      transition: color 0.25s;
    }
    .note.in-tune { color: var(--ok); text-shadow: 0 0 28px rgba(255, 106, 43, 0.45); }
    .cents {
      font-size: 0.95rem;
      color: var(--muted);
      margin-top: 0.2rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.06em;
    }
    .hint {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.35rem;
      min-height: 1.1em;
      opacity: 0.85;
    }

    /* Controls */
    .controls {
      width: min(100%, 420px);
      display: flex;
      gap: 0.6rem;
      margin-top: 1.25rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      appearance: none;
      border: 1px solid #243044;
      background: rgba(14, 20, 32, 0.85);
      color: var(--fg);
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.7rem 1.15rem;
      border-radius: 999px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    button:hover { border-color: #3a4d6a; }
    button.primary {
      background: linear-gradient(180deg, #1a2a44, #0e1624);
      border-color: rgba(61, 180, 255, 0.45);
    }
    button.primary.active {
      border-color: var(--blue);
      box-shadow: 0 0 20px rgba(61, 180, 255, 0.3);
      color: var(--blue);
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .string-row {
      width: min(100%, 420px);
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.4rem;
      margin-top: 1rem;
    }
    .string-chip {
      text-align: center;
      padding: 0.55rem 0.2rem;
      border-radius: 10px;
      border: 1px solid #1e2a3d;
      background: rgba(10, 16, 28, 0.6);
      font-size: 0.7rem;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.18s;
    }
    .string-chip.active {
      border-color: var(--blue);
      color: var(--blue);
      background: rgba(61, 180, 255, 0.08);
      box-shadow: 0 0 12px rgba(61, 180, 255, 0.15);
    }
    .string-chip .n { display: block; font-size: 0.9rem; font-weight: 600; color: inherit; }

    .footer {
      margin-top: auto;
      padding-top: 1.5rem;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #3a4658;
    }

    /* Manual demo slider (dev / no-mic) */
    .manual {
      width: min(100%, 420px);
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      border: 1px solid #1a2434;
      background: rgba(8, 12, 20, 0.5);
      display: none;
    }
    .manual.show { display: block; }
    .manual label {
      display: flex; justify-content: space-between;
      font-size: 0.65rem; color: var(--muted);
      letter-spacing: 0.08em; margin-bottom: 0.35rem;
    }
    input[type=range] {
      width: 100%; accent-color: var(--blue);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><strong>Needle</strong> · Methodz</div>
    <div class="status-pill" id="statusPill">Ready</div>
  </header>

  <div class="stage">
    <div class="pegs left" id="pegsLeft"></div>

    <div class="emblem-wrap">
      <div class="shield">
        <div class="flame-canvas"><canvas id="flame" width="200" height="220"></canvas></div>
        <div class="m-letter">M</div>
      </div>
    </div>

    <div class="pegs right" id="pegsRight"></div>
  </div>

  <div class="readout">
    <div class="note" id="note">—</div>
    <div class="cents" id="cents">— ¢</div>
    <div class="hint" id="hint">Tap Listen, then pluck a string</div>
  </div>

  <div class="string-row" id="stringRow"></div>

  <div class="controls">
    <button class="primary" id="btnListen">Listen</button>
    <button id="btnManual">Manual</button>
  </div>

  <div class="manual" id="manualPanel">
    <label><span>Cents offset</span><span id="manualVal">0 ¢</span></label>
    <input type="range" id="centsSlider" min="-60" max="60" value="0" step="1" />
  </div>

  <div class="footer">tuning.methodz.ca</div>

  <script>
    // ─── String map (standard guitar, player-facing headstock) ───
    const STRINGS = [
      { name: "Low E", note: "E2", freq: 82.41, side: "left",  idx: 0 },
      { name: "A",     note: "A2", freq: 110.00, side: "left",  idx: 1 },
      { name: "D",     note: "D3", freq: 146.83, side: "left",  idx: 2 },
      { name: "G",     note: "G3", freq: 196.00, side: "right", idx: 3 },
      { name: "B",     note: "B3", freq: 246.94, side: "right", idx: 4 },
      { name: "High E",note: "E4", freq: 329.63, side: "right", idx: 5 },
    ];

    let activeString = 0;
    let listening = false;
    let manualMode = false;
    let currentCents = 0;
    let smoothedCents = 0;

    // ─── Build pegs + chips ───
    const pegsLeft = document.getElementById("pegsLeft");
    const pegsRight = document.getElementById("pegsRight");
    const stringRow = document.getElementById("stringRow");
    const pegEls = [];

    STRINGS.forEach((s, i) => {
      const peg = document.createElement("div");
      peg.className = "peg";
      peg.innerHTML = `<div class="wing"></div><div class="label">${s.note.replace(/\d/, "")}</div>`;
      peg.onclick = () => selectString(i);
      (s.side === "left" ? pegsLeft : pegsRight).appendChild(peg);
      pegEls.push({ el: peg, stringIndex: i });

      const chip = document.createElement("div");
      chip.className = "string-chip";
      chip.innerHTML = `<span class="n">${s.note.replace(/\d/, "")}</span>${s.name}`;
      chip.onclick = () => selectString(i);
      stringRow.appendChild(chip);
    });

    function selectString(i) {
      activeString = i;
      document.querySelectorAll(".string-chip").forEach((c, idx) => c.classList.toggle("active", idx === i));
      pegEls.forEach(({ el, stringIndex }) => el.classList.toggle("active", stringIndex === i));
      updateUI();
    }
    selectString(0);

    // ─── UI refs ───
    const noteEl = document.getElementById("note");
    const centsEl = document.getElementById("cents");
    const hintEl = document.getElementById("hint");
    const statusPill = document.getElementById("statusPill");
    const btnListen = document.getElementById("btnListen");
    const btnManual = document.getElementById("btnManual");
    const manualPanel = document.getElementById("manualPanel");
    const centsSlider = document.getElementById("centsSlider");
    const manualVal = document.getElementById("manualVal");

    function statusText(c) {
      if (Math.abs(c) <= 5) return "In tune · hold";
      if (c < 0) return "Too low · tighten";
      return "Too high · loosen";
    }

    function updateUI() {
      const s = STRINGS[activeString];
      const c = smoothedCents;
      noteEl.textContent = s.note.replace(/\d/, "");
      noteEl.classList.toggle("in-tune", Math.abs(c) <= 5);
      centsEl.textContent = `${c > 0 ? "+" : ""}${c.toFixed(0)} ¢`;
      hintEl.textContent = statusText(c);
      statusPill.textContent = Math.abs(c) <= 5 ? "Locked" : (listening ? "Listening" : "Ready");
      statusPill.classList.toggle("ok", Math.abs(c) <= 5);

      pegEls.forEach(({ el, stringIndex }) => {
        const active = stringIndex === activeString;
        el.classList.toggle("active", active);
        const wing = el.querySelector(".wing");
        const angle = active ? Math.max(-50, Math.min(50, c)) * 2.4 : 0;
        wing.style.transform = `rotate(${angle}deg)`;
      });
    }

    // ─── Flame canvas (states match SPEC) ───
    const canvas = document.getElementById("flame");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    let particles = [];
    let intensity = 0; // 0..1 mapped from cents
    let redCore = 0;

    function mapFlame(c) {
      // ≤ −40 sparks, −40→−8 rising, −5→+5 locked, +8→+40 enlarge, ≥+40 rage
      const abs = Math.abs(c);
      if (c <= -40) { intensity = 0.12; redCore = 0; }
      else if (c < -5) {
        const t = (c + 40) / 35;
        intensity = 0.15 + t * 0.55;
        redCore = Math.max(0, (c + 20) / 15);
      }
      else if (c <= 5) { intensity = 0.72; redCore = 1; }
      else if (c < 40) {
        const t = (c - 5) / 35;
        intensity = 0.72 + t * 0.35;
        redCore = 1 - t;
      }
      else { intensity = 1.15; redCore = 0; }
    }

    function spawn() {
      const n = 3 + Math.floor(intensity * 8);
      for (let i = 0; i < n; i++) {
        particles.push({
          x: W * 0.5 + (Math.random() - 0.5) * 28 * intensity,
          y: H * 0.78 + Math.random() * 10,
          vx: (Math.random() - 0.5) * 0.9,
          vy: -1.2 - Math.random() * 2.4 * intensity,
          life: 1,
          decay: 0.012 + Math.random() * 0.018,
          r: 3 + Math.random() * 7 * intensity,
          isCore: Math.random() < redCore * 0.55,
        });
      }
    }

    function drawFlame() {
      ctx.clearRect(0, 0, W, H);
      mapFlame(smoothedCents);

      // soft base glow
      const g = ctx.createRadialGradient(W/2, H*0.7, 4, W/2, H*0.55, 70 * intensity);
      if (redCore > 0.3) {
        g.addColorStop(0, `rgba(255, 80, 30, ${0.35 * redCore})`);
        g.addColorStop(0.4, `rgba(255, 140, 40, ${0.18 * intensity})`);
        g.addColorStop(1, "rgba(30, 120, 255, 0)");
      } else {
        g.addColorStop(0, `rgba(80, 180, 255, ${0.25 * intensity})`);
        g.addColorStop(0.5, `rgba(40, 140, 255, ${0.12 * intensity})`);
        g.addColorStop(1, "rgba(20, 80, 200, 0)");
      }
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      if (Math.random() < 0.7) spawn();

      particles = particles.filter(p => p.life > 0);
      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy *= 0.99;
        p.life -= p.decay;
        const a = Math.max(0, p.life);
        const r = p.r * (0.5 + a * 0.5);
        const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
        if (p.isCore && redCore > 0.2) {
          grd.addColorStop(0, `rgba(255, 90, 20, ${a})`);
          grd.addColorStop(0.5, `rgba(255, 160, 40, ${a * 0.6})`);
          grd.addColorStop(1, "rgba(255, 100, 20, 0)");
        } else {
          grd.addColorStop(0, `rgba(120, 200, 255, ${a * 0.95})`);
          grd.addColorStop(0.55, `rgba(40, 140, 255, ${a * 0.5})`);
          grd.addColorStop(1, "rgba(20, 80, 200, 0)");
        }
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(drawFlame);
    }
    drawFlame();

    // ─── Pitch detection (lightweight autocorrelation) ───
    let audioCtx, analyser, mediaStream, buf;

    function freqToCents(freq, target) {
      return 1200 * Math.log2(freq / target);
    }

    function detectPitch(buffer, sampleRate) {
      // Simple autocorrelation peak search (good enough for guitar fundamentals)
      const SIZE = buffer.length;
      let rms = 0;
      for (let i = 0; i < SIZE; i++) rms += buffer[i] * buffer[i];
      rms = Math.sqrt(rms / SIZE);
      if (rms < 0.01) return -1;

      let r1 = 0, r2 = SIZE - 1, thres = 0.2;
      for (let i = 0; i < SIZE / 2; i++) {
        if (Math.abs(buffer[i]) < thres) { r1 = i; break; }
      }
      for (let i = 1; i < SIZE / 2; i++) {
        if (Math.abs(buffer[SIZE - i]) < thres) { r2 = SIZE - i; break; }
      }

      const buf2 = buffer.slice(r1, r2);
      const n = buf2.length;
      const c = new Array(n).fill(0);
      for (let i = 0; i < n; i++) {
        for (let j = 0; j < n - i; j++) c[i] += buf2[j] * buf2[j + i];
      }

      let d = 0;
      while (c[d] > c[d + 1]) d++;
      let maxval = -1, maxpos = -1;
      for (let i = d; i < n; i++) {
        if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
      }
      if (maxpos <= 0) return -1;

      // parabolic interpolation
      const x1 = c[maxpos - 1] || 0, x2 = c[maxpos], x3 = c[maxpos + 1] || 0;
      const a = (x1 + x3 - 2 * x2) / 2;
      const b = (x3 - x1) / 2;
      const T0 = a ? maxpos - b / (2 * a) : maxpos;
      return sampleRate / T0;
    }

    async function startListen() {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const src = audioCtx.createMediaStreamSource(mediaStream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 4096;
        src.connect(analyser);
        buf = new Float32Array(analyser.fftSize);
        listening = true;
        btnListen.classList.add("active");
        btnListen.textContent = "Stop";
        statusPill.textContent = "Listening";
        loop();
      } catch (e) {
        hintEl.textContent = "Mic permission needed — or use Manual";
        console.warn(e);
      }
    }

    function stopListen() {
      listening = false;
      btnListen.classList.remove("active");
      btnListen.textContent = "Listen";
      if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
      if (audioCtx) audioCtx.close().catch(() => {});
      statusPill.textContent = "Ready";
    }

    function loop() {
      if (!listening) return;
      analyser.getFloatTimeDomainData(buf);
      const freq = detectPitch(buf, audioCtx.sampleRate);
      if (freq > 60 && freq < 1200) {
        // auto-select closest string if far from current target
        let best = activeString, bestDiff = Infinity;
        STRINGS.forEach((s, i) => {
          const d = Math.abs(freqToCents(freq, s.freq));
          if (d < bestDiff) { bestDiff = d; best = i; }
        });
        if (bestDiff < 100) selectString(best);

        const target = STRINGS[activeString].freq;
        currentCents = freqToCents(freq, target);
        // clamp extreme
        currentCents = Math.max(-80, Math.min(80, currentCents));
      }
      // smooth
      smoothedCents += (currentCents - smoothedCents) * 0.22;
      updateUI();
      requestAnimationFrame(loop);
    }

    btnListen.onclick = () => listening ? stopListen() : startListen();

    btnManual.onclick = () => {
      manualMode = !manualMode;
      manualPanel.classList.toggle("show", manualMode);
      btnManual.classList.toggle("active", manualMode);
      if (manualMode && listening) stopListen();
    };

    centsSlider.oninput = () => {
      currentCents = Number(centsSlider.value);
      smoothedCents = currentCents;
      manualVal.textContent = `${currentCents > 0 ? "+" : ""}${currentCents} ¢`;
      updateUI();
    };

    // init
    updateUI();
  </script>
</body>
</html>
